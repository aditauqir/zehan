name: CI

on:
  push:
    branches:
      - main
      - feature
      - debug
  pull_request:
    branches:
      - main
      - feature
      - debug

jobs:
  debug-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Build Debug app
        run: |
          xcodebuild -project Zehan.xcodeproj \
            -scheme Zehan \
            -configuration Debug \
            -derivedDataPath /tmp/ZehanDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build
