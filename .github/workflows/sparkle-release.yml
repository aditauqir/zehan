name: Sparkle Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Build Release app
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh

      - name: Package update zip and installer DMG
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Zirn.app/Contents/Info.plist)"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Zirn.app/Contents/Info.plist)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          chmod +x scripts/create-dmg.sh
          scripts/create-dmg.sh build/Zirn.app

      - name: Sign update and refresh appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          chmod +x scripts/sparkle-release.sh
          if [[ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY secret is not configured."
            exit 1
          fi
          SPARKLE_TOOLS=/tmp scripts/sparkle-release.sh "${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Zirn v${{ env.VERSION }}
          files: |
            dist/Zirn-${{ env.VERSION }}.dmg
            dist/Zirn-${{ env.VERSION }}.zip
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sparkle/appcast.xml || true
          git diff --cached --quiet && echo "No appcast changes to commit." && exit 0
          git commit -m "Update Sparkle appcast for v${VERSION}."
          git push
